services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_intel}
      POSTGRES_DB: ${POSTGRES_DB:-ai_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_intel}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
