<svg width="900" viewBox="0 0 900 980" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7c5cbf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#b07a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">AI Research Intelligence System</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#888">High-level architecture</text>

  <!-- ── LAYER LABELS (left) ── -->
  <text x="18" y="118" text-anchor="middle" font-size="10" fill="#aaa" transform="rotate(-90,18,118)">1 · Sources</text>
  <text x="18" y="258" text-anchor="middle" font-size="10" fill="#aaa" transform="rotate(-90,18,258)">2 · Collection</text>
  <text x="18" y="448" text-anchor="middle" font-size="10" fill="#aaa" transform="rotate(-90,18,448)">3 · Intelligence</text>
  <text x="18" y="618" text-anchor="middle" font-size="10" fill="#aaa" transform="rotate(-90,18,618)">4 · Synthesis</text>
  <text x="18" y="778" text-anchor="middle" font-size="10" fill="#aaa" transform="rotate(-90,18,778)">5 · Delivery</text>

  <!-- ── DIVIDERS ── -->
  <line x1="36" y1="166" x2="864" y2="166" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="36" y1="316" x2="864" y2="316" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="36" y1="516" x2="864" y2="516" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="36" y1="686" x2="864" y2="686" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ── LAYER 1: SOURCES ── -->
  <!-- Lab blogs -->
  <rect x="44" y="78" width="180" height="64" rx="8" fill="#f5f5f4" stroke="#d1d0cb" stroke-width="0.8"/>
  <text x="134" y="103" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2c2a">Lab blogs / RSS</text>
  <text x="134" y="121" text-anchor="middle" font-size="11" fill="#73726c">Anthropic, OpenAI, DeepMind</text>

  <!-- ArXiv -->
  <rect x="244" y="78" width="180" height="64" rx="8" fill="#f5f5f4" stroke="#d1d0cb" stroke-width="0.8"/>
  <text x="334" y="103" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2c2a">ArXiv / papers</text>
  <text x="334" y="121" text-anchor="middle" font-size="11" fill="#73726c">cs.AI, cs.LG, cs.CL</text>

  <!-- GitHub -->
  <rect x="444" y="78" width="180" height="64" rx="8" fill="#f5f5f4" stroke="#d1d0cb" stroke-width="0.8"/>
  <text x="534" y="103" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2c2a">GitHub signals</text>
  <text x="534" y="121" text-anchor="middle" font-size="11" fill="#73726c">Trending, forks, stars</text>

  <!-- Community -->
  <rect x="644" y="78" width="210" height="64" rx="8" fill="#f5f5f4" stroke="#d1d0cb" stroke-width="0.8"/>
  <text x="749" y="103" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2c2a">Community / policy</text>
  <text x="749" y="121" text-anchor="middle" font-size="11" fill="#73726c">Forums, X, GovAI, NIST</text>

  <!-- Down arrows layer 1→2 -->
  <line x1="134" y1="142" x2="134" y2="188" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="334" y1="142" x2="334" y2="188" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="534" y1="142" x2="534" y2="188" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="749" y1="142" x2="749" y2="188" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ── LAYER 2: COLLECTION ── -->
  <!-- Crawlers -->
  <rect x="44" y="188" width="230" height="64" rx="8" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="0.8"/>
  <text x="159" y="213" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Crawlers / schedulers</text>
  <text x="159" y="231" text-anchor="middle" font-size="11" fill="#0f6e56">Polls every few hours</text>

  <!-- Normalize -->
  <rect x="294" y="188" width="230" height="64" rx="8" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="0.8"/>
  <text x="409" y="213" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Normalize / dedupe</text>
  <text x="409" y="231" text-anchor="middle" font-size="11" fill="#0f6e56">Canonical item schema</text>

  <!-- Store -->
  <rect x="544" y="188" width="310" height="64" rx="8" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="0.8"/>
  <text x="699" y="213" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Item store + embeddings</text>
  <text x="699" y="231" text-anchor="middle" font-size="11" fill="#0f6e56">Postgres + vector DB</text>

  <!-- Arrows layer 2 horizontal -->
  <line x1="274" y1="220" x2="292" y2="220" stroke="#5dcaa5" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="524" y1="220" x2="542" y2="220" stroke="#5dcaa5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Down arrow layer 2→3 -->
  <line x1="699" y1="252" x2="699" y2="338" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ── LAYER 3: INTELLIGENCE ── -->
  <!-- Relevance model -->
  <rect x="44" y="338" width="240" height="88" rx="8" fill="#eeedfe" stroke="#afa9ec" stroke-width="0.8"/>
  <text x="164" y="366" text-anchor="middle" font-size="13" font-weight="500" fill="#26215c">Relevance model</text>
  <text x="164" y="384" text-anchor="middle" font-size="11" fill="#534ab7">Predicts future importance</text>
  <text x="164" y="400" text-anchor="middle" font-size="11" fill="#534ab7">from historical patterns</text>

  <!-- Feature engineering -->
  <rect x="304" y="338" width="240" height="88" rx="8" fill="#eeedfe" stroke="#afa9ec" stroke-width="0.8"/>
  <text x="424" y="366" text-anchor="middle" font-size="13" font-weight="500" fill="#26215c">Feature engineering</text>
  <text x="424" y="384" text-anchor="middle" font-size="11" fill="#534ab7">Velocity, propagation,</text>
  <text x="424" y="400" text-anchor="middle" font-size="11" fill="#534ab7">cross-domain signals</text>

  <!-- Explanation layer -->
  <rect x="564" y="338" width="290" height="88" rx="8" fill="#eeedfe" stroke="#afa9ec" stroke-width="0.8"/>
  <text x="709" y="366" text-anchor="middle" font-size="13" font-weight="500" fill="#26215c">Explanation layer (XAI)</text>
  <text x="709" y="384" text-anchor="middle" font-size="11" fill="#534ab7">SHAP → evidence trail →</text>
  <text x="709" y="400" text-anchor="middle" font-size="11" fill="#534ab7">human-readable narrative</text>

  <!-- Arrows layer 3 horizontal -->
  <line x1="284" y1="382" x2="302" y2="382" stroke="#7c5cbf" stroke-width="1" marker-end="url(#arrow-purple)"/>
  <line x1="544" y1="382" x2="562" y2="382" stroke="#7c5cbf" stroke-width="1" marker-end="url(#arrow-purple)"/>

  <!-- Down arrows layer 3→4 -->
  <line x1="164" y1="426" x2="164" y2="532" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="709" y1="426" x2="709" y2="532" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ── LAYER 4: SYNTHESIS ── -->
  <!-- Digest writer -->
  <rect x="44" y="532" width="380" height="88" rx="8" fill="#faece7" stroke="#f0997b" stroke-width="0.8"/>
  <text x="234" y="560" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1b0c">Claude — digest writer</text>
  <text x="234" y="578" text-anchor="middle" font-size="11" fill="#993c1d">Reads top-ranked items,</text>
  <text x="234" y="594" text-anchor="middle" font-size="11" fill="#993c1d">writes TL;DRs and summaries</text>

  <!-- Analyst -->
  <rect x="444" y="532" width="410" height="88" rx="8" fill="#faece7" stroke="#f0997b" stroke-width="0.8"/>
  <text x="649" y="560" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1b0c">Claude — analyst</text>
  <text x="649" y="578" text-anchor="middle" font-size="11" fill="#993c1d">Cross-item reasoning,</text>
  <text x="649" y="594" text-anchor="middle" font-size="11" fill="#993c1d">interpretive briefings for consulting</text>

  <!-- Down arrows layer 4→5 -->
  <line x1="180" y1="620" x2="180" y2="706" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="620" x2="450" y2="706" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="700" y1="620" x2="700" y2="706" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ── LAYER 5: DELIVERY ── -->
  <!-- User digest -->
  <rect x="44" y="706" width="240" height="64" rx="8" fill="#e6f1fb" stroke="#85b7eb" stroke-width="0.8"/>
  <text x="164" y="731" text-anchor="middle" font-size="13" font-weight="500" fill="#042c53">User digest UI</text>
  <text x="164" y="749" text-anchor="middle" font-size="11" fill="#185fa5">Web app, email, API</text>

  <!-- Consulting -->
  <rect x="304" y="706" width="260" height="64" rx="8" fill="#e6f1fb" stroke="#85b7eb" stroke-width="0.8"/>
  <text x="434" y="731" text-anchor="middle" font-size="13" font-weight="500" fill="#042c53">Consulting workspace</text>
  <text x="434" y="749" text-anchor="middle" font-size="11" fill="#185fa5">Briefings, deep dives</text>

  <!-- Alerts -->
  <rect x="584" y="706" width="270" height="64" rx="8" fill="#e6f1fb" stroke="#85b7eb" stroke-width="0.8"/>
  <text x="719" y="731" text-anchor="middle" font-size="13" font-weight="500" fill="#042c53">Alerts / weak signals</text>
  <text x="719" y="749" text-anchor="middle" font-size="11" fill="#185fa5">Threshold-based push</text>

  <!-- Down arrows layer 5→feedback -->
  <line x1="164" y1="770" x2="164" y2="836" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="434" y1="770" x2="434" y2="836" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="719" y1="770" x2="719" y2="836" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ── FEEDBACK LOOP ── -->
  <rect x="44" y="836" width="810" height="68" rx="8" fill="#faeeda" stroke="#ef9f27" stroke-width="0.8"/>
  <text x="449" y="862" text-anchor="middle" font-size="13" font-weight="500" fill="#412402">Feedback loop</text>
  <text x="449" y="880" text-anchor="middle" font-size="11" fill="#854f0b">Reads, clicks, annotations on explanations → retraining signal for relevance model</text>

  <!-- Feedback arrow back to intelligence layer -->
  <path d="M44 870 L26 870 L26 382 L42 382" fill="none" stroke="#b07a1a" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <text x="14" y="626" text-anchor="middle" font-size="10" fill="#b07a1a" transform="rotate(-90,14,626)">retrains</text>

  <!-- Legend -->
  <rect x="44" y="930" width="810" height="36" rx="6" fill="#fafafa" stroke="#e8e8e8" stroke-width="0.5"/>
  <rect x="60" y="941" width="14" height="14" rx="3" fill="#f5f5f4" stroke="#d1d0cb" stroke-width="0.8"/>
  <text x="82" y="952" font-size="11" fill="#73726c">Sources</text>
  <rect x="146" y="941" width="14" height="14" rx="3" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="0.8"/>
  <text x="168" y="952" font-size="11" fill="#73726c">Collection</text>
  <rect x="248" y="941" width="14" height="14" rx="3" fill="#eeedfe" stroke="#afa9ec" stroke-width="0.8"/>
  <text x="270" y="952" font-size="11" fill="#73726c">Intelligence (moat)</text>
  <rect x="396" y="941" width="14" height="14" rx="3" fill="#faece7" stroke="#f0997b" stroke-width="0.8"/>
  <text x="418" y="952" font-size="11" fill="#73726c">Synthesis (Claude)</text>
  <rect x="544" y="941" width="14" height="14" rx="3" fill="#e6f1fb" stroke="#85b7eb" stroke-width="0.8"/>
  <text x="566" y="952" font-size="11" fill="#73726c">Delivery</text>
  <rect x="636" y="941" width="14" height="14" rx="3" fill="#faeeda" stroke="#ef9f27" stroke-width="0.8"/>
  <text x="658" y="952" font-size="11" fill="#73726c">Feedback loop</text>
</svg>
